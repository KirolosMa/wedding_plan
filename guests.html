<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guests – Wedding Planner</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#b76e79" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="nav"></div>
  <main class="page">
    <div class="page-header">
      <h1>Guests</h1>
      <span class="muted">Manage your guest list and RSVPs.</span>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <h3>Invited</h3>
        <div class="value" id="stat-invited">—</div>
      </div>
      <div class="summary-card">
        <h3>Confirmed</h3>
        <div class="value" id="stat-yes">—</div>
        <span class="muted" id="stat-heads">—</span>
      </div>
      <div class="summary-card">
        <h3>Declined</h3>
        <div class="value" id="stat-no">—</div>
      </div>
      <div class="summary-card">
        <h3>Pending</h3>
        <div class="value" id="stat-pending">—</div>
      </div>
      <div class="summary-card">
        <h3>Missing mobile</h3>
        <div class="value" id="stat-no-phone">—</div>
        <span class="muted">Needed for automated invites</span>
      </div>
    </div>

    <details class="add-details">
      <summary>Add a guest</summary>
      <form id="add-item-form" class="add-form">
      <div class="form-grid">
        <label>Name<input type="text" data-field="name" required /></label>
        <label>Mobile<input type="tel" data-field="phone" placeholder="+20 100 123 4567" autocomplete="tel" /></label>
        <label>Side
          <select data-field="side">
            <option value="bride">Bride</option>
            <option value="groom">Groom</option>
            <option value="both">Both</option>
          </select>
        </label>
        <label>RSVP
          <select data-field="rsvp_status">
            <option value="pending">Pending</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </label>
        <label>Meal choice<input type="text" data-field="meal_choice" /></label>
        <label class="muted" style="align-self: end;">
          <input type="checkbox" data-field="invited" checked style="width: auto; display: inline-block;" /> Invited
        </label>
        <label class="muted" style="align-self: end;">
          <input type="checkbox" data-field="plus_one" style="width: auto; display: inline-block;" /> Plus one
        </label>
      </div>
      <label>Notes<textarea data-field="notes" rows="2"></textarea></label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add guest</button>
      </div>
    </form>
    </details>

    <div class="toolbar">
      <div class="search-box">
        <input type="search" id="search-input" placeholder="Search name, mobile, meal, notes…" aria-label="Search guests" />
      </div>
      <label class="muted">Show
        <select id="filter-select">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="yes">Confirmed</option>
          <option value="no">Declined</option>
          <option value="no-phone">Missing mobile</option>
        </select>
      </label>
      <label class="muted">Side
        <select id="side-select">
          <option value="all">All</option>
          <option value="bride">Bride</option>
          <option value="groom">Groom</option>
          <option value="both">Both</option>
        </select>
      </label>
      <span class="result-count" id="result-count"></span>
      <div class="toolbar-actions">
        <button type="button" class="btn btn-secondary" id="copy-numbers">Copy mobiles</button>
        <button type="button" class="btn btn-secondary" id="export-csv">Export CSV</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="data-table stacked-table">
        <thead>
          <tr>
            <th class="col-title">Name</th>
            <th>Mobile</th>
            <th>Side</th>
            <th class="col-check">Invited</th>
            <th>RSVP</th>
            <th>Meal</th>
            <th class="col-check">+1</th>
            <th class="col-notes">Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="js/guests.js"></script>
</body>
</html>
