<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guests – Wedding Planner</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="nav"></div>
  <main class="page">
    <div class="page-header">
      <h1>Guests</h1>
      <span class="muted">Manage your guest list and RSVPs.</span>
    </div>

    <p id="banner" class="banner" hidden></p>

    <div class="summary-grid">
      <div class="summary-card">
        <h3>Invited</h3>
        <div class="value" id="stat-invited">—</div>
      </div>
      <div class="summary-card">
        <h3>Confirmed</h3>
        <div class="value" id="stat-yes">—</div>
      </div>
      <div class="summary-card">
        <h3>Declined</h3>
        <div class="value" id="stat-no">—</div>
      </div>
      <div class="summary-card">
        <h3>Pending</h3>
        <div class="value" id="stat-pending">—</div>
      </div>
    </div>

    <form id="add-item-form" class="add-form">
      <h2>Add a guest</h2>
      <div class="form-grid">
        <label>Name<input type="text" data-field="name" required /></label>
        <label>Side
          <select data-field="side">
            <option value="bride">Bride</option>
            <option value="groom">Groom</option>
            <option value="both">Both</option>
          </select>
        </label>
        <label>RSVP
          <select data-field="rsvp_status">
            <option value="pending">Pending</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </label>
        <label>Meal choice<input type="text" data-field="meal_choice" /></label>
        <label class="muted" style="align-self: end;">
          <input type="checkbox" data-field="invited" checked style="width: auto; display: inline-block;" /> Invited
        </label>
        <label class="muted" style="align-self: end;">
          <input type="checkbox" data-field="plus_one" style="width: auto; display: inline-block;" /> Plus one
        </label>
      </div>
      <label>Notes<textarea data-field="notes" rows="2"></textarea></label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add guest</button>
      </div>
    </form>

    <div class="page-header">
      <span></span>
      <label class="muted">Show
        <select id="filter-select">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="yes">Confirmed</option>
          <option value="no">Declined</option>
        </select>
      </label>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Side</th>
            <th>Invited</th>
            <th>RSVP</th>
            <th>Meal</th>
            <th>+1</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="js/guests.js"></script>
</body>
</html>
