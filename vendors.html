<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendors – Wedding Planner</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#b76e79" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="nav"></div>
  <main class="page">
    <div class="page-header">
      <h1>Vendors</h1>
      <span class="muted">Track caterers, photographers, florists and more.</span>
    </div>

    <details class="add-details">
      <summary>Add a vendor</summary>
      <form id="add-item-form" class="add-form">
      <div class="form-grid">
        <label>Category<input type="text" data-field="category" placeholder="e.g. Catering" /></label>
        <label>Name<input type="text" data-field="name" required /></label>
        <label>Contact name<input type="text" data-field="contact_name" /></label>
        <label>Email<input type="email" data-field="contact_email" /></label>
        <label>Phone<input type="tel" data-field="contact_phone" /></label>
        <label>Price<input type="number" data-field="price" step="0.01" min="0" /></label>
        <label>Status
          <select data-field="status">
            <option value="considering">Considering</option>
            <option value="contacted">Contacted</option>
            <option value="booked">Booked</option>
            <option value="paid">Paid</option>
          </select>
        </label>
      </div>
      <label>Notes<textarea data-field="notes" rows="2"></textarea></label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add vendor</button>
      </div>
    </form>
    </details>

    <div class="toolbar">
      <div class="search-box">
        <input type="search" id="search-input" placeholder="Search vendors, contact, notes…" aria-label="Search vendors" />
      </div>
      <label class="muted">Category
        <select id="filter-select">
          <option value="all">All</option>
        </select>
      </label>
      <span class="result-count" id="result-count"></span>
    </div>

    <div id="vendors-list" class="card-grid"></div>
  </main>
  <script type="module" src="js/vendors.js"></script>
</body>
</html>
