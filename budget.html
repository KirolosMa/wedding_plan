<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget – Wedding Planner</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#b76e79" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="nav"></div>
  <main class="page">
    <div class="page-header">
      <h1>Budget</h1>
      <span class="muted">Keep estimated and actual costs side by side.</span>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <h3>Total budget</h3>
        <div class="value" id="stat-total-budget">—</div>
      </div>
      <div class="summary-card">
        <h3>Estimated</h3>
        <div class="value" id="stat-estimated">—</div>
      </div>
      <div class="summary-card">
        <h3>Actual spent</h3>
        <div class="value" id="stat-actual">—</div>
      </div>
      <div class="summary-card">
        <h3>Remaining</h3>
        <div class="value" id="stat-remaining">—</div>
      </div>
    </div>
    <div class="card" style="margin-bottom: 24px;">
      <span class="muted">Spent vs. total budget</span>
      <div class="progress"><div id="progress-bar" class="progress-bar" style="width: 0%;"></div></div>
    </div>

    <details class="add-details">
      <summary>Add a budget line</summary>
      <form id="add-item-form" class="add-form">
      <div class="form-grid">
        <label>Category<input type="text" data-field="category" required /></label>
        <label>Estimated cost<input type="number" data-field="estimated_cost" step="0.01" min="0" value="0" /></label>
        <label>Actual cost<input type="number" data-field="actual_cost" step="0.01" min="0" value="0" /></label>
      </div>
      <label>Notes<textarea data-field="notes" rows="2"></textarea></label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add line</button>
      </div>
    </form>
    </details>

    <div class="toolbar">
      <div class="search-box">
        <input type="search" id="search-input" placeholder="Search budget categories, notes…" aria-label="Search budget lines" />
      </div>
      <span class="result-count" id="result-count"></span>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Category</th>
            <th>Estimated</th>
            <th>Actual</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="js/budget.js"></script>
</body>
</html>
